services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geopipe
      POSTGRES_USER: geopipe
      POSTGRES_PASSWORD: geopipe
    ports:
      - "5432:5432"
    volumes:
      - geopipe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geopipe -d geopipe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  geopipe_pg:
